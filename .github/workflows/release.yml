name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Release tag '$env:RELEASE_TAG' is not a valid vX.Y.Z tag."
          }

      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify package version matches tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($packageVersion -ne $tagVersion) {
            throw "package.json version '$packageVersion' does not match tag '$env:RELEASE_TAG'."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Check Electron process code
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/installer.cjs

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' }
          if (-not $assets) { throw 'No release assets were generated.' }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS -Encoding ascii
          Get-Content release/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ERPNext Desktop ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-rc') }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/SHA256SUMS
          fail_on_unmatched_files: true
